<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Student Registration | Campus Placement Portal</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <style>

        body {
            min-height: 100vh;
            margin: 0;

            background:
                linear-gradient(
                    135deg,
                    #eaf2ff,
                    #f8fbff
                );

            font-family: "Segoe UI", Arial, sans-serif;
        }

        .auth-container {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 35px 15px;
        }

        .auth-card {
            width: 100%;
            max-width: 570px;

            border: none;
            border-radius: 20px;

            background: white;

            box-shadow:
                0 15px 45px rgba(31,41,55,0.12);

            overflow: hidden;
        }

        .auth-header {
            padding: 28px 25px;

            text-align: center;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #0d6efd,
                    #084298
                );
        }

        .auth-icon {
            width: 60px;
            height: 60px;

            margin: 0 auto 14px;

            border-radius: 16px;

            background:
                rgba(255,255,255,0.17);

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 28px;
        }

        .auth-header h1 {
            margin: 0 0 5px;

            font-size: 1.5rem;
            font-weight: 700;
        }

        .auth-header p {
            margin: 0;

            font-size: 0.87rem;

            opacity: 0.85;
        }

        .auth-body {
            padding: 30px;
        }

        .form-label {
            font-weight: 600;
            color: #374151;
        }

        .form-control {
            min-height: 45px;

            border-radius: 9px;

            border: 1px solid #dbe1ea;

            padding: 10px 13px;
        }

        .form-control:focus {
            border-color: #0d6efd;

            box-shadow:
                0 0 0 3px
                rgba(13,110,253,0.10);
        }

        .register-btn {
            min-height: 47px;

            border: none;
            border-radius: 9px;

            font-weight: 700;

            background:
                linear-gradient(
                    135deg,
                    #0d6efd,
                    #084298
                );
        }

        .login-text {
            color: #6b7280;
            font-size: 0.9rem;
        }

        .login-text a {
            color: #0d6efd;
            font-weight: 600;
            text-decoration: none;
        }

        .login-text a:hover {
            text-decoration: underline;
        }

        .portal-text {
            text-align: center;

            margin-top: 20px;

            color: #9ca3af;

            font-size: 0.78rem;
        }

        @media (max-width: 576px) {

            .auth-body {
                padding: 23px;
            }

            .auth-header {
                padding: 25px 20px;
            }

        }

    </style>

</head>


<body>


    <div class="auth-container">

        <div class="auth-card">


            <!-- HEADER -->

            <div class="auth-header">

                <div class="auth-icon">

                    <i class="bi bi-person-plus-fill"></i>

                </div>

                <h1>
                    Student Registration
                </h1>

                <p>
                    Create your placement portal account
                </p>

            </div>


            <!-- BODY -->

            <div class="auth-body">

                <form id="registerForm">


                    <!-- FULL NAME -->

                    <div class="mb-3">

                        <label
                            for="full_name"
                            class="form-label">

                            Full Name

                        </label>

                        <input
                            type="text"
                            id="full_name"
                            class="form-control"
                            placeholder="Enter your full name"
                            required>

                    </div>


                    <!-- EMAIL -->

                    <div class="mb-3">

                        <label
                            for="email"
                            class="form-label">

                            Email Address

                        </label>

                        <input
                            type="email"
                            id="email"
                            class="form-control"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required>

                    </div>


                    <!-- PHONE -->

                    <div class="mb-3">

                        <label
                            for="phone"
                            class="form-label">

                            Phone Number

                        </label>

                        <input
                            type="text"
                            id="phone"
                            class="form-control"
                            placeholder="Enter your phone number"
                            required>

                    </div>


                    <!-- COURSE -->

                    <div class="mb-3">

                        <label
                            for="course"
                            class="form-label">

                            Course

                        </label>

                        <input
                            type="text"
                            id="course"
                            class="form-control"
                            placeholder="e.g. BCA"
                            required>

                    </div>


                    <!-- PASSWORD -->

                    <div class="mb-4">

                        <label
                            for="password"
                            class="form-label">

                            Password

                        </label>

                        <input
                            type="password"
                            id="password"
                            class="form-control"
                            placeholder="Create a password"
                            autocomplete="new-password"
                            required>

                    </div>


                    <!-- REGISTER -->

                    <button
                        type="submit"
                        class="btn btn-primary register-btn w-100">

                        <i class="bi bi-person-plus me-2"></i>

                        Create Account

                    </button>


                </form>


                <div
                    class="text-center login-text mt-4">

                    Already have an account?

                    <a href="student-login.html">
                        Login
                    </a>

                </div>


                <div class="portal-text">

                    <i class="bi bi-shield-check me-1"></i>

                    Campus Placement Portal

                </div>

            </div>

        </div>

    </div>


    <!-- EXISTING JS -->

    <script src="../js/register.js"></script>

</body>

</html>
